# Category names the model uses when routing _force_catalogue() calls.
# Each entry is a string the customer might say to identify a category,
# mapped to what list_products(category=...) accepts. The first entry found
# in the utterance wins, so the more specific words come first ("chicken
# nuggets" must hit "nugget" before "chicken"). kiosk-core maps burger, side,
# drink, beverage and dessert onto the plural categories; nugget, shake, fries,
# sandwich and meal fall through to its product-name search.
category_names:
  - nugget
  - shake
  - fries
  - sandwich
  - chicken
  - burger
  - breakfast
  - side
  - beverage
  - drink
  - dessert
  - meal
  - kids
