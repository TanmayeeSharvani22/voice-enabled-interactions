# Smart Kiosk — intent keyword rules for the ordering agent
#
# These lists drive the regex patterns built dynamically in ordering_agent.py
# at startup (domain_config.build_*_regex()). They are QSR/food-specific and
# must be replaced or extended when the rag-service is used in another domain
# (healthcare, education, retail) via a different mounted config.
#
# Ranger Burgers (North American) variant of configs/rag-service/intent_rules.yaml.
# Same four lists and the same design rules as the QuickBite Express original:
#   - catalogue_keywords: generic menu/price phrases plus CATEGORY nouns only.
#     Item nouns (shake, coffee, tea, chicken) stay out, because a catalogue
#     match disables knowledge pre-grounding for ingredient/dietary questions.
#   - domain_keywords: deliberately wide; a miss sends a 4+ word question to
#     the out-of-scope refusal.
#   - knowledge_keywords: outlet facts (hours, policies, dietary).
# Indian-menu words (dosa, biryani, lassi, pepsi, roll, upi, parcel) are
# replaced with the Ranger Burgers equivalents.

# Words that signal the customer is asking about menu items, prices, or
# availability. Triggers _CATALOGUE_QUERY_RE recovery guard and pre-grounding.
catalogue_keywords:
  - do you have
  - have you got
  - do you sell
  - menu
  - item
  - items
  - dish
